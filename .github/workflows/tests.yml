name: Tests
on:
  - push
  - pull_request

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            toxenv: 'py'
          - python: '3.10'
            toxenv: 'setup'
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system setuptools pip tox
    - name: linting
      run: |
        uvx ruff check
    - name: Test with tox
      run: tox -e ${{ matrix.toxenv }}
